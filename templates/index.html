<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
</head>
<body>
    <h1>Welcome to the Notes App</h1>
    <form action="/add" method="POST">
        <input type="text" id="noteInput" name="content" placeholder="Enter your note here">
        <button id="addNoteButton">Add Note</button>
    </form>
    <hr>
    {% for note in notes %}
        <div class="note">
            <p>{{ note[1] }}</p>
            <form action="/delete/{{ note[0] }}" method="DELETE">
                <button type="submit">Delete</button>
            </form>
        </div>
    {% endfor %}
</body>
</html>
